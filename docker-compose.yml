version: '3.8'

services:
  borsa_bot:
    build: .
    container_name: borsa_scalp_bot
    restart: always
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Istanbul
    volumes:
      # Sadece dinamik veri dosyalari mount ediliyor (pycache ve venv cashleri engellenir)
      - ./bot.db:/app/bot.db
      - ./bot.log:/app/bot.log
    ports:
      - "8000:8000"
